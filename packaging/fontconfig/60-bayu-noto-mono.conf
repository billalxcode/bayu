<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Cutefish defaulted to Debian's "Noto Mono"; Enterprise Linux ships the same
     design as "Noto Sans Mono". Keeps older saved settings monospaced. -->
<fontconfig>
  <alias binding="same">
    <family>Noto Mono</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
