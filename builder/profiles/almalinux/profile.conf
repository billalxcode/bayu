# AlmaLinux 10 with the Bayu desktop. Read by build-image.sh and
# build-iso.sh; repositories come from repos.d/ next to this file and
# rootfs/ (shared with the igos profile) is copied over the system.
DISTRO_NAME="AlmaLinux 10 (Bayu)"
RELEASEVER=10
IMAGE_NAME=alma-bayu
IMAGE_SIZE=16G
ISO_LABEL=ALMA-10-BAYU
HOSTNAME=bayu
TIMEZONE=Asia/Jakarta
LOCALE=en_US.UTF-8
KEYMAP=us
USER_NAME=bayu
USER_PASSWORD=bayu        # change me; the live ISO logs in without it
ROOT_PASSWORD=            # empty: root locked
AUTOLOGIN=yes
SUDO_NOPASSWD=yes
SELINUX=permissive
# lapis (Android apps) is installed but stays off until enabled:
#   sudo systemctl enable --now lapis-control.socket && sudo lapis init
LAPIS_ENABLED=no
# Wi-Fi: broadcom-wl + kmod-wl for the older Broadcom chips of MacBooks up to
# 2015 (see rootfs/etc/modprobe.d/wl.conf), firmware for brcmfmac (newer
# Broadcom, as in MacBooks from 2015 on) and Intel cards.
PACKAGES="@core kernel grub2-pc grub2-efi-x64 shim-x64 grub2-tools xfsprogs dracut-config-generic
  glibc-langpack-en glibc-langpack-id almalinux-release linux-firmware mesa-dri-drivers
  broadcom-wl kmod-wl brcmfmac-firmware iwlwifi-mvm-firmware iwlwifi-dvm-firmware
  qemu-guest-agent bayu-desktop lapis"
