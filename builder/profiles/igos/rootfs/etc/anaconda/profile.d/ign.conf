# Anaconda configuration for IGOS Nusantara (os-release ID=ign): AlmaLinux's,
# whose shim and GRUB packages it ships, so the boot loader goes to
# EFI/almalinux on the EFI system partition. Without a profile Anaconda takes
# EFI/default, which no package fills, and fails in gen_grub_cfgstub.

[Profile]
profile_id = ign
base_profile = almalinux

[Profile Detection]
os_id = ign
