# kmod-wl claims every PCI wireless card (alias pci:v*d*sv*sd*bc02sc80i*),
# including chips it does not support, such as the BCM43602 of 2015
# MacBooks, which then crash. Its aliases are ignored here, and
# /etc/udev/rules.d/90-wl.rules loads it for the chips its README lists;
# other cards get their in-kernel driver (brcmfmac, iwlwifi, ...).
blacklist wl
