# Overrides /usr/lib/modprobe.d/broadcom-wl-blacklist.conf from broadcom-wl.
# wl drives the Broadcom chips of older MacBooks (BCM4311-BCM4360); these
# in-kernel drivers would claim the same chips first.
blacklist ssb
blacklist bcma
blacklist b43
blacklist brcmsmac
# brcmfmac is not blacklisted: it drives the newer chips wl does not support
# (BCM4350, BCM43602, BCM4364 and others in MacBooks from 2016 on).
