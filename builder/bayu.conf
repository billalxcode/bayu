# OS image settings, read by build-image.sh. Repositories live in repos.d/;
# any *.repo there is used, so add, remove or repoint them freely.
RELEASEVER=10
IMAGE_NAME=bayu-os
IMAGE_SIZE=12G
HOSTNAME=bayu
TIMEZONE=Asia/Jakarta
LOCALE=en_US.UTF-8
KEYMAP=us
USER_NAME=bayu
USER_PASSWORD=bayu        # change me
ROOT_PASSWORD=            # empty: root locked
AUTOLOGIN=yes             # log USER_NAME straight into Bayu
SUDO_NOPASSWD=yes         # USER_NAME runs sudo without a password
SELINUX=permissive
PACKAGES="@core kernel grub2-pc grub2-tools xfsprogs dracut-config-generic
  glibc-langpack-en almalinux-release qemu-guest-agent
  mesa-dri-drivers bayu-desktop"
