# Follows AlmaLinux's kernel: when BaseOS has a newer one than
# packaging/kernel/build-kernel.sh builds, it is rebuilt with binder, wl is
# built for it, and packaging/kernel/test-kernel.sh tests it (binder, PSI,
# the Wi-Fi drivers, wl, a boot in QEMU). A kernel that passes comes as a
# pull request that moves KERNEL to it, so the next release ships it; one
# that fails comes as an issue with the test's log, and nothing changes.
name: Kernel

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: kernel
  cancel-in-progress: false

jobs:
  follow:
    runs-on: [self-hosted, bayu-builder]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Find AlmaLinux's kernel
        id: find
        run: |
          current=$(sed -n 's/^KERNEL=${KERNEL:-\(.*\)}$/\1/p' packaging/kernel/build-kernel.sh)
          latest=$(curl -fsSL https://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os/Packages/ |
            grep -o 'kernel-core-6[^"]*\.x86_64\.rpm' | sed 's/^kernel-core-//; s/\.x86_64\.rpm$//' | sort -uV | tail -1)
          echo "current $current, AlmaLinux $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ -z "$latest" ] || [ "$latest" = "$current" ] ||
             [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            echo "new=" >> "$GITHUB_OUTPUT"
          elif gh pr list --state open --head "kernel-$latest" --json number -q '.[0].number' | grep -q .; then
            echo "A pull request for $latest is open"
            echo "new=" >> "$GITHUB_OUTPUT"
          else
            echo "new=$latest" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        if: steps.find.outputs.new != ''
        env:
          KERNEL: ${{ steps.find.outputs.new }}
        run: |
          packaging/kernel/build-kernel.sh
          packaging/wl/build-wl.sh

      - name: Test
        id: test
        if: steps.find.outputs.new != ''
        env:
          KERNEL: ${{ steps.find.outputs.new }}
        run: |
          wl=$(sed -n 's/^WL=${WL:-\(.*\)}$/\1/p' packaging/wl/build-wl.sh)
          set -o pipefail
          packaging/kernel/test-kernel.sh "$HOME/.cache/bayu-kernel/$KERNEL" "$HOME/.cache/bayu-wl/$wl" 2>&1 |
            grep -v NOKEY | tee "$RUNNER_TEMP/kernel-test.log"

      - name: Propose it
        if: steps.find.outputs.new != '' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL: ${{ steps.find.outputs.new }}
          CURRENT: ${{ steps.find.outputs.current }}
        run: |
          branch="kernel-$KERNEL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          sed -i "s/^KERNEL=\${KERNEL:-.*}$/KERNEL=\${KERNEL:-$KERNEL}/" packaging/kernel/build-kernel.sh
          git commit -qam "Kernel: AlmaLinux $KERNEL with binder"
          git push -q origin "$branch"
          {
            echo "AlmaLinux has kernel \`$KERNEL\` (Bayu ships \`$CURRENT\`). It was built with binder and passed \`packaging/kernel/test-kernel.sh\`:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/kernel-test.log"
            echo '```'
            echo
            echo "Merging it makes the next release ship it, with wl built for it. Try it on a MacBook with Broadcom Wi-Fi and a Realtek card first if you can."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --head "$branch" --title "Kernel: AlmaLinux $KERNEL with binder" --body-file "$RUNNER_TEMP/body.md"

      - name: Report a failure
        if: failure() && steps.find.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL: ${{ steps.find.outputs.new }}
        run: |
          {
            echo "AlmaLinux's kernel \`$KERNEL\` did not pass Bayu's kernel test, so Bayu stays on its kernel. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -60 "$RUNNER_TEMP/kernel-test.log" 2>/dev/null || echo "The build failed before the test."
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Kernel $KERNEL fails Bayu's kernel test" --body-file "$RUNNER_TEMP/issue.md"
