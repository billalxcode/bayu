# Builds bayu-desktop .rpm and .src.rpm on AlmaLinux 10 for every pull request
# and uploads them as a workflow artifact. Not on a push to main: what is
# merged was built in its pull request, and a vX.Y.Z tag builds and publishes
# it with release.yml.
#
# Runs on the self-hosted runner on sj (label bayu-builder), in the
# bayu-builder image that packaging/build-rpm.sh builds from
# packaging/Containerfile.
name: RPM

on:
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    runs-on: [self-hosted, bayu-builder]
    steps:
      # A cancelled run leaves its build containers running (they hold CPU
      # and disk); the runner takes one job at a time, so any left are stale.
      - name: Clear the last build
        run: |
          podman ps -aq --filter ancestor=localhost/bayu-builder | xargs -r podman rm -f
          sudo podman ps -aq --filter ancestor=localhost/bayu-builder | xargs -r sudo podman rm -f
          podman image prune -f >/dev/null
          sudo rm -rf out

      # clean: false keeps the downloaded Skia between runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Build RPMs
        run: packaging/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bayu-desktop-rpms
          path: out/rpms/*.rpm
