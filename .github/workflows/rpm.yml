# Builds bayu-desktop .rpm and .src.rpm on AlmaLinux 10 for every push and
# pull request and uploads them as a workflow artifact. Releases come from
# release.yml.
#
# Runs on the self-hosted runner on sj (label bayu-builder), in the
# bayu-builder image that packaging/build-rpm.sh builds from
# packaging/Containerfile.
name: RPM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    runs-on: [self-hosted, bayu-builder]
    steps:
      - name: Clear the last build
        run: sudo rm -rf out

      # clean: false keeps the downloaded Skia between runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Build RPMs
        run: packaging/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bayu-desktop-rpms
          path: out/rpms/*.rpm
