name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: bayuos/.github/.github/workflows/build.yml@main
    with:
      dependencies: icons bayu-toolkit bayu-framework
      test-projects: >-
        common/tests appruntime/tests session/tests bayu-services/tests
        tests/battery tests/crash tests/language tests/nightlight tests/permissions
        tests/power tests/privacy tests/screenrecorder
