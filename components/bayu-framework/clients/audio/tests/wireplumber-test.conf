# The tests' cards are the client's alone: WirePlumber picking a profile or
# restoring a route's volume would race the client's own writes.
wireplumber.profiles = {
  policy = {
    hooks.device.profile.find-best = disabled
    hooks.device.profile.find-preferred = disabled
    hooks.device.profile.state = disabled
    hooks.device.routes.find-best = disabled
    hooks.device.routes.state = disabled
  }
}
